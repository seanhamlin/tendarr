# Example for Docker Compose or Synology Container Manager (Project).
# Copy to compose.yaml and adjust the volume path, PUID and PGID.
services:
  tendarr:
    image: ghcr.io/seanhamlin/tendarr:latest
    container_name: tendarr
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      # Holds the SQLite database (accounts, connection settings, history).
      - /volume1/docker/tendarr:/data
    environment:
      # The NAS user and group that own the folder above; the container gives
      # /data to them and runs as them. On Synology, find yours with
      # `id <username>` over SSH; 1026 and 100 are typical for the first user.
      PUID: 1026
      PGID: 100
      TZ: Etc/UTC  # your timezone, e.g. Europe/London; used for displayed dates
      # Set to "true" if you put this behind an HTTPS reverse proxy that does
      # not send X-Forwarded-Proto.
      TENDARR_COOKIE_SECURE: auto
      TENDARR_LOG_FORMAT: text

# Pin the network to a range that cannot overlap your LAN. Left to choose,
# Docker may pick 192.168.x.0/20, which swallows addresses like 192.168.1.x
# and makes Plex/Radarr/Sonarr unreachable ("no route to host").
networks:
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24
